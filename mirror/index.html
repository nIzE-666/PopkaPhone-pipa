<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: file:; font-src 'self' file:">
<title>NaomiPhone</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; user-select: none; }
  /* кадр телефона — во всё окно, в своих пропорциях: окно растягивают как угодно — по краям чёрные поля
     (пропорции самого окна macOS считает с заголовком — кадр так сжимался на 2 %) */
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; object-fit: contain;
    touch-action: none; }
  /* Заставка без дока (docs/SCREENS.md): обои стола во всё окно и часы — как у приставки (pi/dock/clock.cpp); поверх
     кадра, пока стол на это окно не выведен. Обои и часы проявляются и тают порознь (renderer.js, «Заставка») */
  #wall {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(#1b1424, #08070b) center / cover no-repeat;
  }
  #clock { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #clock text { fill: #ece9e3; font-feature-settings: "tnum"; }
  #time { font-family: "Google Sans Flex", -apple-system, sans-serif; font-weight: 300; }
  #date { font-family: "Google Sans", -apple-system, sans-serif; font-weight: 500; fill-opacity: .85; }
  /* курсор другого экрана (мышь приставки): стрелка стола поверх кадра (CursorAt) */
  #guest { position: absolute; left: 0; top: 0; width: 22px; height: 22px; pointer-events: none; display: none; }
  #status {
    position: absolute; left: 8px; right: 8px; bottom: 18px; display: flex; justify-content: center;
    color: #a9a49a; font: 500 11px -apple-system, "Google Sans", sans-serif; letter-spacing: 1.2px;
    text-align: center; overflow-wrap: anywhere; text-transform: uppercase; pointer-events: none;
    text-shadow: 0 1px 6px rgba(0, 0, 0, .6);
  }
  #hud {
    position: absolute; left: 8px; bottom: 8px; padding: 6px 8px; border-radius: 6px;
    background: rgba(0, 0, 0, .72); color: #e8e0d6; font: 11px/1.45 ui-monospace, Menlo, monospace;
    white-space: pre; pointer-events: none; display: none;
  }
  body.hud #hud { display: block; }
</style>
</head>
<body>
<canvas id="screen" width="720" height="1560"></canvas>
<div id="wall"></div>
<svg id="clock" xmlns="http://www.w3.org/2000/svg"><g id="clockInk"><text id="time"></text><text id="date"></text></g></svg>
<svg id="guest" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
  <path d="M3 2 L3 17.5 L7.3 13.6 L10.1 20 L12.8 18.8 L10 12.6 L15.8 12.6 Z" fill="#111" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
</svg>
<div id="status">подключаюсь…</div>
<div id="hud"></div>
<script src="renderer.js"></script>
</body>
</html>
