# Pipa security & Wi-Fi stability:
# - Randomize MAC during Wi-Fi scans (prevents probe-request tracking away from home).
# - Override default-wifi-powersave-on.conf so low-latency Wi-Fi is used at home
#   (pipa-mode dynamically enables powersave on foreign networks in Away mode).
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.powersave=2
